<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시범 조합 4 · 디자인 시스템 적용(침프)</title>
<link rel="stylesheet" href="/engine/base.css">
<style>
/* 머리말: 레퍼런스처럼 맨 위 페퍼콘 알림 띠 + 흰 메뉴 막대(굵은 13px 메뉴, 테두리 알약 + 노란 알약). 테마 토큰을 따른다 */
.mc-head{position:fixed;z-index:90;left:0;right:0;top:0;font:700 13px/1.5 var(--font-body);color:var(--c-peppercorn,#231e15)}
.mc-bar{display:flex;justify-content:center;gap:6px;padding:7px 16px;background:var(--c-peppercorn,#231e15);color:#fff;font-weight:400}
.mc-bar a{color:#fff;text-decoration:underline}
.mc-nav{display:flex;align-items:center;gap:28px;height:64px;padding:0 32px;background:#fff;border-bottom:1px solid var(--c-oyster,#dbd9d2)}
.mc-logo{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:500 22px/1 var(--font-display);letter-spacing:-.02em}
.mc-logo i{width:30px;height:30px;border-radius:50%;background:var(--c-peppercorn,#231e15);box-shadow:inset 0 0 0 7px var(--c-cavendish,#ffe01b)}
.mc-nav nav{display:flex;gap:24px;flex:1}
.mc-nav nav a{color:inherit;text-decoration:none}
.mc-nav nav a small{font-size:9px;margin-left:4px}
.mc-right{display:flex;gap:10px}
.mc-right a{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:26px;color:inherit;text-decoration:none;box-shadow:0 0 0 1px var(--c-peppercorn,#231e15)}
.mc-right a.y{background:var(--c-cavendish,#ffe01b)}
html[data-theme]:not([data-theme="chimp"]) .mc-head{display:none}
@media (max-width:900px){.mc-nav nav{display:none}.mc-nav{justify-content:space-between}}
#panel{position:fixed;z-index:100;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(20,20,20,.88);color:#fff;font:13px/1.4 -apple-system,'Apple SD Gothic Neo',sans-serif;backdrop-filter:blur(8px)}
#panel .row{display:flex;gap:6px;flex-wrap:wrap}
#panel button{padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:transparent;color:#fff;font:inherit;cursor:pointer}
#panel button.on{background:#fff;color:#111}
#panel small{opacity:.65}
#panel a{color:#fff;opacity:.8}
#panel label{display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<header class="mc-head" aria-label="머리말">
  <div class="mc-bar">지금 예약하면 첫 숙박 15% 할인. <a href="#">바로 보기</a></div>
  <div class="mc-nav">
    <a class="mc-logo" href="#"><i aria-hidden="true"></i>STAY HAUS</a>
    <nav aria-label="주 메뉴"><a href="#">호텔<small>▾</small></a><a href="#">식당 + 바<small>▾</small></a><a href="#">예술<small>▾</small></a><a href="#">소식</a><a href="#">요금</a></nav>
    <div class="mc-right"><a href="#">로그인</a><a class="y" href="#">지금 예약</a></div>
  </div>
</header>
<main id="page"></main>
<div id="panel">
  <div class="row" id="themes"></div>
  <small id="info"></small>
  <a id="ds-link" href="/pages/design-system/?id=chimp" target="_blank">디자인 시스템 보기 ↗</a>
  <label><input type="checkbox" id="src"> 모듈 출처 표시</label>
</div>
<script type="module">
import { createEngine } from "/engine/engine.js";
import themes from "/engine/themes.js";
import page from "./page.js";

const qs = new URLSearchParams(location.search);
const engine = createEngine({ root: document.getElementById("page"), sections: page.sections, themes, theme: qs.get("theme") || page.theme });
window.engine = engine;

const box = document.getElementById("themes"), info = document.getElementById("info");
function paint() {
  const t = engine.theme;
  box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === t.id));
  const s = t.scroll.lerp ? `스크롤 lerp ${t.scroll.lerp}` : `스크롤 ${t.scroll.duration}초`;
  info.textContent = `${s} · 움직임 배율 ${t.motion.speed} · ${t.motion.ease.out}`;
  const ds = document.getElementById("ds-link");
  ds.hidden = !t.system;
  if (t.system) ds.href = `/pages/design-system/?id=${t.id}`;
}
themes.forEach((t) => {
  const b = document.createElement("button");
  b.textContent = t.name; b.dataset.id = t.id;
  b.onclick = () => { engine.setTheme(t.id); history.replaceState(null, "", `?theme=${t.id}`); paint(); };
  box.appendChild(b);
});
document.getElementById("src").onchange = (e) => document.documentElement.classList.toggle("show-source", e.target.checked);
paint();
</script>
</body>
</html>
