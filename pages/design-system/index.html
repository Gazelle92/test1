<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 시스템</title>
<link rel="stylesheet" href="/engine/base.css">
<style>
body{padding:0 var(--grid-margin,32px) 96px}
.wrap{max-width:1376px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:56px 0 32px;border-bottom:1px solid var(--c-fg)}
.top h1{margin:0;font:var(--display-weight) 64px/1 var(--font-display);letter-spacing:var(--display-tracking)}
.mono{font-family:var(--font-mono,var(--font-body));text-transform:uppercase;font-size:12px;letter-spacing:0}
.top a{color:inherit}
section.ds{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:32px 0;border-bottom:1px solid var(--c-fg)}
section.ds>h2{margin:0;font:400 14px/1.3 var(--font-mono,var(--font-body));text-transform:uppercase}
ul.mood{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:20px;line-height:1.35}
ul.mood li::before{content:"— "}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0}
.sw{margin:-1px 0 0 -1px;border:1px solid var(--c-fg)}
.sw i{display:block;height:110px;border-bottom:1px solid var(--c-fg)}
.sw div{padding:10px 12px;font-size:13px;line-height:1.4}
.sw b{display:block;font-weight:500}
.sw .mono{font-size:11px;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:12px 10px;border-top:1px solid var(--c-line,rgba(0,0,0,.1));text-align:left;vertical-align:top}
th{font:400 11px/1.3 var(--font-mono,var(--font-body));text-transform:uppercase;opacity:.7}
.type-row{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:baseline;padding:14px 0;border-top:1px solid var(--c-line,rgba(0,0,0,.1))}
.type-row:first-child{border-top:0}
.type-row .meta{font:400 11px/1.4 var(--font-mono,var(--font-body));text-transform:uppercase;opacity:.75}
.demo{position:relative;display:flex;flex-wrap:wrap;gap:40px 72px;align-items:flex-start}
.demo h2{margin:0;font:var(--display-weight) 64px/1 var(--font-display)}
.chip{display:inline-block;padding:8px 10px;border-radius:4px;background:var(--c-fg);color:var(--c-bg);font:400 10px/1.3 var(--font-mono,var(--font-body));text-transform:uppercase}
.card{width:300px;overflow:hidden;border:1px solid var(--c-line);border-radius:var(--radius);background:var(--c-surface)}
.card .ph{height:190px;background:linear-gradient(135deg,var(--c-lavender,#b5b7d8),var(--c-wine,#672b3c))}
.card .cap{padding:12px;border-top:1px solid var(--c-line)}
.card h4{margin:0 0 10px;font:var(--display-weight) 29px/1.1 var(--font-display);letter-spacing:-.01em}
.note{font-size:13px;opacity:.7;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script type="module">
// 테마 파일의 system(분석 결과)과 토큰을 그대로 읽어 그린다 → 문서와 실제 적용값이 어긋나지 않는다.
import themes from "/engine/themes.js";
import { applyTokens } from "/engine/engine.js";

const id = new URLSearchParams(location.search).get("id") || "drake";
const t = themes.find((x) => x.id === id && x.system) || themes.find((x) => x.system);
applyTokens(t);
const s = t.system;
const fam = { display: "var(--font-display)", body: "var(--font-body)", mono: "var(--font-mono)" };
const root = document.getElementById("root");
root.innerHTML = `
  <div class="top">
    <div><p class="mono">디자인 시스템 · 테마 id: ${t.id}</p><h1>${s.name}</h1></div>
    <p class="mono">레퍼런스 <a href="${s.reference}" target="_blank" rel="noopener">${s.reference.replace(/^https?:\/\//, "")}</a><br><a href="/pages/${t.page || "drake"}/?theme=${t.id}">적용한 페이지 보기 →</a></p>
  </div>
  <section class="ds"><h2>톤앤매너</h2><ul class="mood">${s.mood.map((m) => `<li>${m}</li>`).join("")}</ul></section>
  <section class="ds"><h2>색</h2><div><div class="swatches">${s.colors.map((c) => `
    <div class="sw"><i style="background:${c.hex}"></i><div><b>${c.name}</b><span class="mono">${c.hex} · --c-${c.id}</span><br>${c.use}</div></div>`).join("")}</div></div></section>
  <section class="ds"><h2>글꼴</h2><table><tr><th>역할</th><th>레퍼런스</th><th>여기서 쓰는 글꼴(무료)</th></tr>${s.fonts.map((f) => `<tr><td>${f.role}</td><td>${f.ref}</td><td>${f.use}</td></tr>`).join("")}</table>
    <p class="note">레퍼런스 글꼴은 유료라 쓰지 않고, 모양이 가장 가까운 무료 글꼴로 바꿨습니다.</p></section>
  <section class="ds"><h2>글자 크기</h2><div>${s.type.map((y) => `
    <div class="type-row"><div class="meta">${y.id}<br>${y.size}px / ${y.lh} / ${y.ls}em${y.upper ? "<br>대문자" : ""}</div>
    <div style="font-family:${fam[y.font]};font-weight:${y.w || (y.font === "display" ? "var(--display-weight)" : 400)};font-size:min(${y.size}px,${(y.size / 14.4).toFixed(2)}vw);line-height:${y.lh};letter-spacing:${y.ls}em;${y.upper ? "text-transform:uppercase;" : ""}">${y.em ? y.sample.replace(y.em, `<em class="dp-em mc-hl">${y.em}</em>`) : y.sample}</div></div>`).join("")}</div></section>
  <section class="ds"><h2>여백·그리드</h2><table>${s.spacing.map((x) => `<tr><td>${x.name}</td><td>${x.value}</td></tr>`).join("")}</table></section>
  <section class="ds"><h2>부품</h2><div>
    <div class="demo" data-module="ds-demo">
      <h2>우리의 공간을<br>둘러보세요</h2>
      <div style="display:flex;flex-direction:column;gap:24px;align-items:flex-start">
        <a class="demo-cta" href="#">자세히 보기</a>
        <span class="chip">도시 호텔에서</span>
      </div>
      <div class="card"><div class="ph"></div><div class="cap"><span class="chip">이번 주</span><h4 style="margin-top:12px">와인 투어</h4><p class="mono" style="margin:0">금 · 오후 7시</p></div></div>
    </div>
    <table style="margin-top:32px">${s.components.map((c) => `<tr><td style="width:180px">${c.name}</td><td>${c.spec}</td></tr>`).join("")}</table></div></section>
  <section class="ds"><h2>움직임</h2><table>${s.motion.map((x) => `<tr><td style="width:180px">${x.name}</td><td>${x.value}</td></tr>`).join("")}</table></section>
  <p class="note">${s.sources}</p>`;
if (t.decorate) t.decorate(root.querySelector(".demo"));
</script>
</body>
</html>
