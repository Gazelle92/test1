<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조립 · 무드 정하기</title>
<style>
html,body{margin:0;background:#111}
html.lenis,html.lenis body{height:auto}
.cb{position:relative}
.cb-stage{position:sticky;top:0;height:100vh;overflow:hidden}
.cb iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.cb-tint{position:absolute;inset:0;pointer-events:none;opacity:0}
.cb-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#888;font:13px -apple-system,sans-serif;transition:opacity .4s}
.cb.is-ready .cb-wait{opacity:0;pointer-events:none}
.show-source .cb::before{content:attr(data-source);position:absolute;z-index:5;left:16px;top:64px;font:600 12px/1 -apple-system,sans-serif;background:#000;color:#fff;padding:7px 10px;border-radius:6px;opacity:.8}

/* 단계 표시 */
#steps{position:fixed;z-index:101;left:16px;top:16px;display:flex;gap:6px;align-items:center;padding:6px;border-radius:10px;background:rgba(20,20,20,.9);font:13px -apple-system,'Apple SD Gothic Neo',sans-serif;color:#aaa}
#steps a,#steps span{padding:6px 10px;border-radius:7px;color:inherit;text-decoration:none}
#steps .on{background:#fff;color:#111;font-weight:600}
#steps a:hover{color:#fff}

/* 무드 패널 */
#panel{position:fixed;z-index:100;right:16px;top:16px;width:300px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:rgba(20,20,20,.94);color:#fff;font:13px/1.5 -apple-system,'Apple SD Gothic Neo',sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#panel.min{width:auto}
#panel.min > :not(.head){display:none}
#panel .head{display:flex;justify-content:space-between;align-items:center}
#panel h2{margin:0;font-size:15px}
#panel h3{margin:0 0 6px;font-size:12px;color:#999;font-weight:500}
#panel .row{display:flex;gap:6px;flex-wrap:wrap}
#panel button{padding:7px 11px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:transparent;color:#fff;font:inherit;cursor:pointer}
#panel button.on{background:#fff;color:#111}
#panel button.main{background:#fff;color:#111;border-color:#fff;font-weight:600}
#panel button:disabled{opacity:.4;cursor:default}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;padding:12px;border:1.5px dashed rgba(255,255,255,.3);border-radius:10px;text-align:center;color:#bbb;cursor:pointer}
#drop.over{border-color:#fff;color:#fff}
#drop img{max-width:100%;max-height:140px;border-radius:6px}
#note{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:inherit;resize:vertical}
#result{display:none;padding:10px;border-radius:10px;background:rgba(255,255,255,.07)}
#result b{display:block;font-size:14px}
#result small{color:#aaa}
#result .sw{display:flex;gap:4px;margin-top:8px}
#result .sw i{width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.2)}
input[type=range]{width:100%}
#panel label{display:flex;gap:6px;align-items:center;cursor:pointer;color:#ccc}
#msg{min-height:1em;color:#f0c674}
</style>
</head>
<body>
<nav id="steps"><a id="toLib" href="#">① 모듈 고르기</a><span>② 조립</span><span class="on">③ 무드 정하기</span></nav>
<main id="page"></main>
<div id="panel">
  <div class="head"><h2>무드 정하기</h2><button id="fold" title="접기">–</button></div>
  <div>
    <h3>기본 무드</h3>
    <div class="row" id="moods"></div>
  </div>
  <div>
    <h3>레퍼런스로 무드 만들기</h3>
    <div id="drop"><span>이미지를 끌어 놓거나 눌러서 고르기<br><small>캡처 이미지 붙여넣기(⌘V)도 됨</small></span></div>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="note" rows="2" placeholder="덧붙일 말(선택) 예: 더 차분하게, 글꼴은 세리프로"></textarea>
    <div class="row" style="margin-top:6px"><button class="main" id="analyze" disabled>이 레퍼런스로 맞추기</button></div>
    <div id="msg"></div>
  </div>
  <div id="result"></div>
  <div>
    <h3>강도 <span id="pct">100%</span> <small style="color:#777">· 낮출수록 원본 무드에 가까움</small></h3>
    <input type="range" id="amount" min="0" max="100" value="100">
  </div>
  <div class="row"><button id="copy">이 조립 주소 복사</button></div>
  <label><input type="checkbox" id="src"> 섹션 출처 표시</label>
</div>
<script type="module">
// 주소: /pages/compose/?list=jeskojets/01-hero,madewithgsap/03-effects,m:pricing-flip&mood=original  (m: = 다시 만든 모듈)
//   &m=<무드 JSON(base64)> &k=<강도 0~100> — 레퍼런스로 만든 무드까지 주소 하나로 다시 열 수 있음
// 입장 확인: 매니저 로그인 또는 모듈 창고 전용 비밀번호 (로컬 개발에서는 검사하지 않음)
import { gate } from "/engine/gate.js";
const BASE = import.meta.env.BASE_URL;
gate();
import { createComposer, MOODS, normalizeMood, moodFromImage } from "/engine/compose.js";
import { originals } from "/clones/catalog.js";

const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search);
const b64 = { enc: (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))) };

const items = (q.get("list") || "").split(",").filter(Boolean)
  .map((id) => id.startsWith("m:")
    // 다시 만든 모듈도 섞을 수 있음: 모듈 미리보기 화면을 같은 방식으로 끼워 넣는다
    ? { id: id.slice(2), category: "모듈", src: `${BASE}pages/preview/?list=${id.slice(2)}&panel=0&theme=${q.get("theme") || "clean"}` }
    : originals.find((o) => o.id === id) || { id, category: "원본" });
document.title = `조립 · ${items.map((i) => i.id.split("/").pop()).join(" + ")}`;
$("#toLib").href = BASE === "/" ? "/pages/library/" : "/manager/modules";
$("#steps span:nth-of-type(1)").textContent = `② 조립 (${items.length}개)`;

// 무드 상태: 고른 무드(원래 값) + 강도(원본 쪽으로 얼마나 덜 바꿀지)
let base = MOODS.find((m) => m.id === q.get("mood")) || MOODS[0];
try { if (q.get("m")) base = normalizeMood({ ...b64.dec(q.get("m")), id: "ref" }); } catch {}
let amount = Math.max(0, Math.min(100, +(q.get("k") ?? 100))) / 100;
const lerp = (a, b, k) => +(a + (b - a) * k).toFixed(3);
const scaled = () => {
  const m = normalizeMood(base), k = amount;
  const F = MOODS[0].filter;
  return { ...m,
    filter: Object.fromEntries(Object.entries(m.filter).map(([key, v]) => [key, lerp(F[key], v, k)])),
    tint: { ...m.tint, opacity: lerp(0, m.tint.opacity, k) },
    scroll: { lerp: lerp(0.1, m.scroll.lerp, k) },
    font: k < 0.35 ? { display: "original", body: "original" } : m.font,   // 강도가 낮으면 글꼴은 원본 유지
    palette: k < 0.35 ? null : m.palette };
};

const c = createComposer({ root: $("#page"), items, mood: scaled() });
window.composer = c;

function saveUrl() {
  const u = new URL(location.href);
  u.searchParams.delete("m"); u.searchParams.delete("mood");
  if (base.id === "ref") u.searchParams.set("m", b64.enc({ name: base.name, summary: base.summary, font: base.font, filter: base.filter, tint: base.tint, scroll: base.scroll, palette: base.palette }));
  else u.searchParams.set("mood", base.id);
  u.searchParams.set("k", Math.round(amount * 100));
  history.replaceState(null, "", u);
}
function apply() { c.setMood(scaled()); saveUrl(); paint(); }

// 기본 무드 버튼
const box = $("#moods");
MOODS.forEach((m) => {
  const b = document.createElement("button");
  b.textContent = m.name; b.dataset.id = m.id;
  b.onclick = () => { base = m; apply(); };
  box.appendChild(b);
});
let refMood = base.id === "ref" ? base : null;
function paint() {
  box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === base.id));
  $("#pct").textContent = `${Math.round(amount * 100)}%`;
  $("#amount").value = Math.round(amount * 100);
  const r = $("#result");
  if (!refMood) { r.style.display = "none"; return; }
  const p = refMood.palette || {};
  r.style.display = "block";
  r.innerHTML = `<b>${refMood.name}${base.id === "ref" ? " · 적용 중" : ""}</b><small>${refMood.summary || ""}${refMood.via === "quick" ? "<br>(내 컴퓨터에서는 간이 분석 — 매니저에서는 AI가 글꼴까지 골라 줌)" : ""}</small>
    <div class="sw">${["bg", "fg", "accent", "surface"].map((k) => p[k] ? `<i style="background:${p[k]}" title="${k} ${p[k]}"></i>` : "").join("")}</div>
    <small>글꼴: ${refMood.font.display} / ${refMood.font.body}</small>
    ${base.id === "ref" ? "" : '<div class="row" style="margin-top:8px"><button id="useRef">이 무드 다시 적용</button></div>'}`;
  $("#useRef")?.addEventListener("click", () => { base = refMood; apply(); });
}

// 레퍼런스 올리기
let picked = null;
const drop = $("#drop"), file = $("#file"), msg = $("#msg");
function pick(f) {
  if (!f || !f.type.startsWith("image/")) { msg.textContent = "이미지 파일만 올릴 수 있어요."; return; }
  picked = f; msg.textContent = "";
  drop.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="레퍼런스">`;
  $("#analyze").disabled = false;
}
drop.onclick = () => file.click();
file.onchange = () => pick(file.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
addEventListener("paste", (e) => { const f = [...(e.clipboardData?.files || [])][0]; if (f) pick(f); });
$("#analyze").onclick = async () => {
  if (!picked) return;
  const btn = $("#analyze"); btn.disabled = true; btn.textContent = "레퍼런스 읽는 중…"; msg.textContent = "";
  try {
    refMood = normalizeMood(await moodFromImage(picked, $("#note").value.trim()));
    refMood.id = "ref";
    base = refMood; amount = 1; apply();
  } catch (e) { msg.textContent = `무드를 만들지 못했어요: ${e.message}`; }
  btn.disabled = false; btn.textContent = "이 레퍼런스로 맞추기";
};

$("#amount").oninput = (e) => { amount = e.target.value / 100; $("#pct").textContent = `${e.target.value}%`; };
$("#amount").onchange = () => apply();
$("#copy").onclick = async (e) => { await navigator.clipboard.writeText(location.href); e.target.textContent = "복사됨"; setTimeout(() => (e.target.textContent = "이 조립 주소 복사"), 1200); };
$("#fold").onclick = () => { const p = $("#panel"); p.classList.toggle("min"); $("#fold").textContent = p.classList.contains("min") ? "+" : "–"; };
$("#src").onchange = (e) => document.documentElement.classList.toggle("show-source", e.target.checked);
saveUrl(); paint();
</script>
</body>
</html>
