<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시범 조합 5 · 디자인 시스템 적용(이솝)</title>
<link rel="stylesheet" href="/engine/base.css">
<style>
/* 머리말: 레퍼런스처럼 맨 위 짙은 회색 알림 띠 + 크림 바탕 가운데 워드마크, 아래 줄 가운데 메뉴, 오른쪽 선만 있는 검색칸 */
.ae-head{position:fixed;z-index:90;left:0;right:0;top:0;color:var(--c-ink,#333);background:var(--c-cream,#fffef2);font:500 14px/1.2 var(--font-body)}
.ae-bar{padding:8px 16px;background:var(--c-ink,#333);color:var(--c-cream,#fffef2);text-align:center;font:400 12px/1.5 var(--font-body)}
.ae-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 64px 6px;font-size:12px;font-weight:700}
.ae-top span{display:flex;gap:18px}
.ae-top span:last-child{justify-content:flex-end}
.ae-mark{font:400 32px/1 var(--font-display);letter-spacing:.02em;color:inherit;text-decoration:none}
.ae-nav{position:relative;display:flex;justify-content:center;gap:26px;padding:12px 64px 16px}
.ae-nav a,.ae-top a{color:inherit;text-decoration:none}
.ae-search{position:absolute;right:64px;top:2px;width:150px;padding:10px 12px;border:1px solid var(--c-line,rgba(51,51,51,.2));font-weight:400;color:#666}
html[data-theme]:not([data-theme="aesop"]) .ae-head{display:none}
@media (max-width:1100px){.ae-nav{display:none}.ae-top{padding:14px 20px}}
#panel{position:fixed;z-index:100;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:rgba(20,20,20,.88);color:#fff;font:13px/1.4 -apple-system,'Apple SD Gothic Neo',sans-serif;backdrop-filter:blur(8px)}
#panel .row{display:flex;gap:6px;flex-wrap:wrap}
#panel button{padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:transparent;color:#fff;font:inherit;cursor:pointer}
#panel button.on{background:#fff;color:#111}
#panel small{opacity:.65}
#panel a{color:#fff;opacity:.8}
#panel label{display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<header class="ae-head" aria-label="머리말">
  <div class="ae-bar">모든 주문에 무료 배송을 해 드려요.</div>
  <div class="ae-top"><span><a href="#">호텔 찾기</a><a href="#">고객 지원</a></span><a class="ae-mark" href="#">Stay Haus</a><span><a href="#">소식 받기</a><a href="#">계정</a><a href="#">예약</a></span></div>
  <nav class="ae-nav" aria-label="주 메뉴"><a href="#">선물</a><a href="#">모든 호텔</a><a href="#">새 소식</a><a href="#">객실</a><a href="#">식당 + 바</a><a href="#">예술</a><a href="#">여행</a><a href="#">서재</a><span class="ae-search">⌕ 검색…</span></nav>
</header>
<main id="page"></main>
<div id="panel">
  <div class="row" id="themes"></div>
  <small id="info"></small>
  <a href="/pages/design-system/?id=aesop" target="_blank">디자인 시스템 보기 ↗</a>
  <label><input type="checkbox" id="src"> 모듈 출처 표시</label>
</div>
<script type="module">
import { createEngine } from "/engine/engine.js";
import themes from "/engine/themes.js";
import page from "./page.js";

const qs = new URLSearchParams(location.search);
const engine = createEngine({ root: document.getElementById("page"), sections: page.sections, themes, theme: qs.get("theme") || page.theme });
window.engine = engine;

const box = document.getElementById("themes"), info = document.getElementById("info");
function paint() {
  const t = engine.theme;
  box.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === t.id));
  const s = t.scroll.lerp ? `스크롤 lerp ${t.scroll.lerp}` : `스크롤 ${t.scroll.duration}초`;
  info.textContent = `${s} · 움직임 배율 ${t.motion.speed} · ${t.motion.ease.out}`;
}
themes.forEach((t) => {
  const b = document.createElement("button");
  b.textContent = t.name; b.dataset.id = t.id;
  b.onclick = () => { engine.setTheme(t.id); history.replaceState(null, "", `?theme=${t.id}`); paint(); };
  box.appendChild(b);
});
document.getElementById("src").onchange = (e) => document.documentElement.classList.toggle("show-source", e.target.checked);
paint();
</script>
</body>
</html>
